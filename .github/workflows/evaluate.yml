name: ICD-11 MMS Coder CI & Evaluation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  native-evaluation:
    name: Native Python Evaluation & Scorer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ICD-11 MMS Coder on Dev Notes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p out
          python coder.py data/dev_notes.jsonl out/predictions.jsonl

      - name: Run Official Scorer
        run: |
          python score.py --gold data/dev_notes.jsonl --pred out/predictions.jsonl --mms data/mms-2026-01.json --per-note out/per_note.jsonl | tee out/score_summary.txt

      - name: Validate Integrity & Score Threshold
        run: |
          python - << 'EOF'
          import json
          with open("out/predictions.jsonl", "r", encoding="utf-8") as f:
              preds = [json.loads(line) for line in f if line.strip()]
          assert len(preds) == 60, f"Expected 60 predictions, got {len(preds)}"
          print(f"Integrity Check Passed: {len(preds)} valid predictions generated.")
          EOF

      - name: Upload Prediction Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: icd11-predictions-native
          path: |
            out/predictions.jsonl
            out/score_summary.txt
            out/per_note.jsonl

  docker-contract:
    name: Docker Compose Contract Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        run: |
          docker compose build

      - name: Prepare In/Out Mount Directories
        run: |
          mkdir -p in out
          chmod -R 777 in out
          cp data/dev_notes.jsonl in/notes.jsonl

      - name: Run Official Submission Contract Command
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          docker compose run --rm coder /in/notes.jsonl /out/predictions.jsonl

      - name: Set up Python for Evaluation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Grade Docker Predictions with score.py
        run: |
          python score.py --gold data/dev_notes.jsonl --pred out/predictions.jsonl --mms data/mms-2026-01.json

      - name: Verify Git Bundle Integrity
        run: |
          git bundle create test_submission.bundle --all
          git bundle verify test_submission.bundle
          echo "Git bundle successfully generated and verified."
